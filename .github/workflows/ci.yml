name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    container:
      image: hexpm/elixir:1.19.5-erlang-28.0.4-ubuntu-noble-20260810
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recurse
          POSTGRES_PASSWORD: recurse
          POSTGRES_DB: recurse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recurse -d recurse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            runner: ubuntu-24.04
          - os: linux-aarch64
            runner: ubuntu-24.04-arm
    env:
      MIX_ENV: test
      POSTGRES_USER: recurse
      POSTGRES_PASSWORD: recurse
      POSTGRES_DB: recurse_test
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools and Rust 1.92.0
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git jq openssl pkg-config python3 libssl-dev unzip wget xxd
          rm -rf /var/lib/apt/lists/*
          mix local.hex --force
          mix local.rebar --force
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.92.0
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
          /root/.cargo/bin/rustc --version
          /root/.cargo/bin/cargo --version

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            apps/recurse_shared/priv/native
            /root/.cargo/registry
            /root/.cargo/git
            native/recurse_cedar/target
            native/recurse_spiffe/target
          key: ${{ matrix.os }}-mix-rust1.92-v2-${{ hashFiles('mix.lock', 'native/recurse_cedar/Cargo.lock', 'native/recurse_spiffe/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-mix-rust1.92-v2-

      - name: mix deps.get
        run: mix deps.get

      - name: Cargo metadata sanity (NIF crates)
        run: |
          cargo metadata --manifest-path native/recurse_cedar/Cargo.toml --format-version 1 > /dev/null
          cargo metadata --manifest-path native/recurse_spiffe/Cargo.toml --format-version 1 > /dev/null

      - name: mix compile --warnings-as-errors
        run: mix compile --warnings-as-errors

      - name: Prepare test database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_$(dpkg --print-architecture)"
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Contracts validation
        run: mix recurse.contracts.validate

      - name: mix test
        run: mix test --exclude perf

      - name: Cedar stability fixture
        run: mix recurse.cedar.stability_check

      - name: mix credo --strict (changed Elixir files)
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            BASE="origin/${GITHUB_BASE_REF}"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMR "${BASE}...HEAD" -- '*.ex' '*.exs' || true)
          if [ -z "${CHANGED}" ]; then
            echo "No Elixir files changed; skipping credo."
          else
            echo "${CHANGED}" | xargs mix credo --strict
          fi

      - name: cargo test (NIFs)
        run: cargo test --manifest-path native/recurse_cedar/Cargo.toml

  ui:
    name: ui (SPA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Tailwind config drift gate (gen + diff)
        working-directory: ui
        run: |
          pnpm gen:tailwind
          git diff --exit-code tailwind.config.ts || (echo "::error::tailwind.config.ts is stale relative to design tokens — run 'pnpm gen:tailwind' locally and commit"; exit 1)

      - name: Types codegen drift gate (gen + diff)
        working-directory: ui
        run: |
          pnpm gen:types
          git diff --exit-code src/lib/types.ts || (echo "::error::src/lib/types.ts is stale relative to apps/recurse_gateway/priv/schemas/*.json — run 'pnpm gen:types' locally and commit"; exit 1)

      - name: ESLint
        working-directory: ui
        run: pnpm lint

      - name: Vitest (unit tests)
        working-directory: ui
        run: pnpm test

      - name: Vite build
        working-directory: ui
        run: pnpm build
